# 서버·테스트와 웹 빌드가 깨지지 않는지 확인한다. GPU·모델·Supabase 키는 필요 없다(테스트는 가짜 DB와 가짜 추론을 쓴다).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - name: 의존성 설치
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-server.txt
      - name: 테스트
        # tts_cpu_inference_test.py, tts_stt_roundtrip_test.py 는 모델이 필요한 수동 실행 스크립트다.
        run: pytest tests -q --ignore=tests/tts_cpu_inference_test.py --ignore=tests/tts_stt_roundtrip_test.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 타입 검사와 빌드
        run: npm run build
