# RunPod은 Pod를 GitHub 레포에서 직접 빌드하지 못하고(그건 Serverless 전용 기능),
# 이미 빌드된 이미지 레지스트리 URL만 받는다(docs/runpod_deploy.md 참고). 그래서 이
# 워크플로가 push마다 대신 이미지를 빌드해서 GHCR(ghcr.io)에 올려두면, RunPod Pod
# 생성 화면엔 그 이미지 주소만 붙여넣으면 된다 - 로컬 Docker 설치/빌드가 필요 없다.
name: Build & Push RunPod Image

on:
  push:
    branches: [seunguk]
    paths:
      - Dockerfile
      - docker/**
      - requirements.txt
      - requirements-main.txt
      - .dockerignore
      - .github/workflows/docker-build.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # CUDA devel 베이스(수 GB) + torch(cu124, 수 GB) + Python 3.13 소스빌드가 겹치면
      # GitHub 기본 러너(디스크 여유 14GB 수준) 용량이 부족할 수 있어서, 이 빌드에 안 쓰는
      # 사전설치 툴체인(Android/.NET/Haskell 등)을 미리 지워 여유를 확보한다.
      - name: 러너 디스크 공간 확보
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR는 이미지 이름에 소문자만 허용하는데 이 레포(minhahamin/cookEar_ai)는
      # 대문자가 섞여있어서, github.repository를 그대로 못 쓰고 소문자로 변환한다.
      - name: 이미지 이름 계산 (소문자 변환)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
