# RunPod은 Pod를 GitHub 레포에서 직접 빌드하지 못하고(그건 Serverless 전용 기능),
# 이미 빌드된 이미지 레지스트리 URL만 받는다(docs/runpod_deploy.md 참고). 그래서 이
# 워크플로가 push마다 대신 이미지를 빌드해서 GHCR(ghcr.io)에 올려두면, RunPod Pod
# 생성 화면엔 그 이미지 주소만 붙여넣으면 된다 - 로컬 Docker 설치/빌드가 필요 없다.
name: Build & Push RunPod Image

on:
  push:
    # main에 병합된 변경사항만 이미지로 빌드한다(요청에 따름, 2026-08-31) - seunguk 등
    # 작업 브랜치에 push할 때마다 매번 30분 가까이 걸리는 빌드가 도는 걸 막기 위함.
    # seunguk 등 비-main 브랜치에서 Dockerfile을 다시 검증해야 하면, main에 이 워크플로
    # 파일이 있어야 뜨는 Actions 웹의 "Run workflow"(workflow_dispatch) 버튼으로 브랜치를
    # 선택해 수동 실행한다(docs/runpod_deploy.md 참고).
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - requirements.txt
      - requirements-main.txt
      - .dockerignore
      - .github/workflows/docker-build.yml
      # 앱 코드/설정 - 이게 빠져있으면 소스만 고쳐서 push해도 이미지가 재빌드 안 되고
      # GHCR엔 예전 코드가 그대로 남는다(2026-08-31 발견). Dockerfile이 COPY . .로
      # 통째로 복사하는 만큼, 실제로 이미지에 들어가는(=.dockerignore에 안 걸리는)
      # 최상위 디렉터리들을 여기 맞춰 나열한다.
      - src/**
      - ui/**
      - db/**
      - data/**
      - .streamlit/**
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # CUDA devel 베이스(수 GB) + torch(cu124, 수 GB) + Python 3.13 소스빌드가 겹치면
      # GitHub 기본 러너(디스크 여유 14GB 수준) 용량이 부족할 수 있어서, 이 빌드에 안 쓰는
      # 사전설치 툴체인(Android/.NET/Haskell 등)을 미리 지워 여유를 확보한다.
      - name: 러너 디스크 공간 확보
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR는 이미지 이름에 소문자만 허용하는데 이 레포(minhahamin/cookEar_ai)는
      # 대문자가 섞여있어서, github.repository를 그대로 못 쓰고 소문자로 변환한다.
      - name: 이미지 이름 계산 (소문자 변환)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
