# Streamlit의 기본 위젯(st.button 등)은 방문자 OS/브라우저의 다크모드 설정을 그대로
# 따라간다 — ui/theme.py의 CSS(:root)는 항상 라이트 모드 색상(#f7f1e6 배경, #241c15
# 텍스트 등)만 정의해뒀는데, 정작 로그인 버튼처럼 커스텀 CSS가 안 닿는 순수 Streamlit
# 위젯은 다크모드 방문자에게 어두운 배경 위에 밝은 글씨로 렌더링돼서 앱 디자인과
# 어긋나거나(예: 다크 배경 위 다크 텍스트로 안 보임) 글씨가 흰색으로 보이는 문제가
# 있었다(2026-08-22 리포트). base="light"로 강제해서 방문자 시스템 설정과 무관하게
# 항상 ui/theme.py와 같은 라이트 톤으로 렌더링되게 한다.
[theme]
base = "light"
primaryColor = "#ee7b36"
backgroundColor = "#f7f1e6"
secondaryBackgroundColor = "#fbf6ec"
textColor = "#241c15"

# 2026-08-23 — 상시 마이크(WebRTC) 연결이 ICE "checking" 단계에서 원인 불명으로 계속
# 리셋되는 문제를 조사하다 추가. 이 프로젝트 폴더가 네트워크 공유 드라이브(CIFS,
# /mnt/lecture/...)에 있고, Streamlit이 WSL을 감지하면 poll 방식 파일 감시로
# 자동 전환한다(시작 로그: "Detected WSL. Using poll-based file watching") — CIFS
# 마운트는 수정시간(mtime)이 미묘하게 흔들릴 수 있어서, 파일을 안 건드려도 Streamlit이
# "파일이 바뀌었다"고 오판해 예상 못한 순간에 전체 재실행(rerun)을 트리거할 가능성이
# 있다. 이 rerun이 WebRTC ICE 협상 도중에 끼면 streamlit-webrtc가 "재생 중도
# 시그널링 중도 아니다"로 보고 연결을 리셋해버린다(src/ui/voice_io.py의
# _run_mic_loop() 주석 참고) — Python 3.13/3.14 둘 다에서 동일하게 재현된 걸 보면
# 이 파일 감시 오작동이 더 근본적인 원인일 가능성이 있어 테스트 중.
[server]
fileWatcherType = "none"
